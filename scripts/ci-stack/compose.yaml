# The CI stack (./index.ts): Directus and its database on the runner, for the integration tests.
name: ci-stack
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "directus"]
      interval: 1s
      retries: 60
    tmpfs: /var/lib/postgresql/data
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  directus:
    image: ${DIRECTUS_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${CI_STACK_DIR}/directus.env
    ports: ["8055:8055"]
    volumes:
      - ${CI_STACK_DIR}/extensions:/directus/extensions:ro
      - ${CI_STACK_DIR}/migrations:/directus/migrations:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8055/server/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 90
  # The fakes dev runs (stacks/backend/clubspot-sync.ts, gsuite-sync.ts), with the same images.
  clubspot-fake:
    image: ${CLUBSPOT_FAKE_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PARSE_SERVER_DATABASE_URI: postgres://directus:directus@postgres:5432/clubspot_fake?max=2
    ports: ["1337:1337"]
    tmpfs: /tmp
    healthcheck:
      # 200 only once the seed has finished.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:1337/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 90
  workspace-fake:
    image: ${WORKSPACE_FAKE_IMAGE}
    environment:
      NEW_GROUP_DELAY_MS: "0"
    ports: ["8080:8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ["8025:8025"]
