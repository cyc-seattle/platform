# The CI stack (./index.ts): Directus and what the features reach beside it, on the runner, for the
# integration tests. Each checkout gets its own project name and host ports, so two can run at once.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
      POSTGRES_DB: directus
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "directus"]
      interval: 1s
      retries: 60
    tmpfs: /var/lib/postgresql/data
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  directus:
    image: ${DIRECTUS_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${CI_STACK_DIR}/directus.env
    ports: ["${DIRECTUS_PORT}:8055"]
    volumes:
      - ${CI_STACK_DIR}/extensions:/directus/extensions:ro
      - ${CI_STACK_DIR}/migrations:/directus/migrations:ro
      # The group-policies hook reads Authentik's address and token here, once ./index.ts writes them.
      - ${CI_STACK_DIR}/authentik-access:/directus/authentik-access:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8055/server/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 90
  # Authentik at its host port inside Directus's network namespace, so Directus reaches the issuer at the same
  # http://localhost address a browser signs in at, and the two agree on every URL Authentik builds.
  authentik-proxy:
    image: ${DIRECTUS_IMAGE}
    network_mode: service:directus
    depends_on: [directus]
    environment:
      PORT: ${AUTHENTIK_PORT}
    entrypoint:
      - node
      - -e
      - |
        const net = require("node:net");
        net
          .createServer((client) => {
            const upstream = net.connect(9000, "authentik-server");
            client.pipe(upstream).pipe(client);
            client.on("error", () => upstream.destroy());
            upstream.on("error", () => client.destroy());
          })
          .listen(Number(process.env.PORT));
  # The fakes dev runs (stacks/backend/clubspot-sync.ts, gsuite-sync.ts), with the same images.
  clubspot-fake:
    image: ${CLUBSPOT_FAKE_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PARSE_SERVER_DATABASE_URI: postgres://directus:directus@postgres:5432/clubspot_fake?max=2
    ports: ["${CLUBSPOT_FAKE_PORT}:1337"]
    tmpfs: /tmp
    healthcheck:
      # 200 only once the seed has finished.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:1337/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 90
  workspace-fake:
    image: ${WORKSPACE_FAKE_IMAGE}
    environment:
      NEW_GROUP_DELAY_MS: "0"
    ports: ["${WORKSPACE_FAKE_PORT}:8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["${MAILPIT_PORT}:8025"]
  # As the `authentik` stack runs it (stacks/authentik/cluster.ts), sending its mail to Mailpit.
  authentik-server:
    image: ${AUTHENTIK_IMAGE}
    command: server
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${CI_STACK_DIR}/authentik.env
    ports: ["${AUTHENTIK_PORT}:9000"]
    volumes:
      - ../../stacks/authentik/templates/email:/templates/email:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 2s
      retries: 150
  authentik-worker:
    image: ${AUTHENTIK_IMAGE}
    command: worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${CI_STACK_DIR}/authentik.env
    volumes:
      - ../../stacks/authentik/templates/email:/templates/email:ro
  # As the `listmonk` stack runs it (stacks/listmonk/index.ts): install and upgrade, then its settings.
  listmonk-install:
    image: ${LISTMONK_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ${CI_STACK_DIR}/listmonk.env
    command:
      ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config ''"]
  listmonk-settings:
    image: postgres:16
    depends_on:
      listmonk-install:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: listmonk
      PGUSER: listmonk
      PGPASSWORD: listmonk
    command: ["psql", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/settings/settings.sql"]
    volumes:
      - ${CI_STACK_DIR}/listmonk:/settings:ro
  listmonk:
    image: ${LISTMONK_IMAGE}
    depends_on:
      listmonk-settings:
        condition: service_completed_successfully
    env_file: ${CI_STACK_DIR}/listmonk.env
    command: ["./listmonk", "--config", ""]
    ports: ["${LISTMONK_PORT}:9000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 2s
      retries: 30
