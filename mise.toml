[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10.34.9"
lefthook = "2"
pulumi = "3.277.0"
# Needs a system Python on macOS.
gcloud = "latest"
# For scripts/cluster-sql and scripts/wait-for-authentik.
jq = "latest"
kubectl = "1.36"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Actions' auth step sets this, so keep it when set. Otherwise it's the main checkout's .gcloud/, even
# from a worktree, so every worktree shares one login.
GOOGLE_APPLICATION_CREDENTIALS = "{{ get_env(name='GOOGLE_APPLICATION_CREDENTIALS', default=exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir)\"') ~ '/.gcloud/application_default_credentials.json') }}"
GCP_PROJECT = "cyc-admin-scripts"
CLOUDSDK_CORE_PROJECT = "{{ env.GCP_PROJECT }}"
# The workplace's gcloud login, so the gcloud CLI uses it in worktrees outside the workplace too.
# Actions has only the default configuration.
CLOUDSDK_ACTIVE_CONFIG_NAME = "{% if get_env(name='GITHUB_ACTIONS', default='') == '' %}isthmia{% else %}default{% endif %}"
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='prod') }}"
# Each stack's state lives in its own environment's bucket, from stacks/bootstrap/state.ts.
PULUMI_BACKEND_URL = "gs://{{ env.GCP_PROJECT }}-pulumi-{{ env.PULUMI_STACK }}"

[tasks.install]
description = "Install dependencies, the Authentik SDK, git hooks, and the GKE auth plugin Pulumi's Kubernetes provider runs"
run = [
  "./scripts/gen-sdks",
  "pnpm install",
  "lefthook install",
  "gcloud components install gke-gcloud-auth-plugin --quiet",
]

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Typecheck, check formatting, and lint"
run = "./scripts/check"

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

[tasks.docs]
description = "Build the docs site from docs/ into docs-site/dist, failing on a broken link"
run = "pnpm --filter @cyc-seattle/platform-docs-site build"

[tasks.docs-dev]
description = "Serve the docs site locally, rebuilding as docs/ changes"
run = "pnpm --filter @cyc-seattle/platform-docs-site dev"

[tasks.ci]
description = "Run all checks and tests"
depends = ["check", "test", "docs"]

# bootstrap is applied by a human with project Owner, never by CI (cyc-seattle/isthmia#118).
[tasks.preview-bootstrap]
description = "Show the diff `mise run deploy-bootstrap` would apply"
run = "pulumi preview --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

[tasks.deploy-bootstrap]
description = "Apply the bootstrap stack"
run = "pulumi up --yes --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

# scripts/each-stack picks the projects from PULUMI_STACK: prod is infra, backend, inbox, listmonk, then
# authentik. Dev's list stays only until its stacks are destroyed (#171).
[tasks.preview]
description = "Show the diff `mise run deploy` would apply to $PULUMI_STACK"
run = "./scripts/each-stack preview"

[tasks.deploy]
description = "Apply $PULUMI_STACK's projects"
run = "./scripts/each-stack up --yes"

[tasks.build]
description = "Build the published package into dist/"
run = "pnpm run build"

[tasks.schema-types]
description = "Regenerate src/schema/index.ts, the Directus schema's types, from schemas/*.yaml"
run = "node scripts/schema-types.ts"

# Run by hand, with your own Google login (docs/syncs.md).
[tasks.calendar-sync]
description = "Sync a spreadsheet's events into Google Calendar"
run = "node src/syncs/calendar/main.ts"

# Before delegating the external domain to Cloud DNS (docs/manual-setup.md): exits 1 on any difference.
[tasks.compare-dns]
description = "Compare the external domain's Cloud DNS zone with the name servers it's delegated to"
run = "node scripts/compare-dns.ts"

# By hand only: no deploy runs it (cyc-seattle/platform#150). docs/website.md says how.
[tasks.load-website]
description = "Load the website's proof of concept into $DIRECTUS_URL, after asking"
run = "node scripts/load-website.ts"

# By hand, each quarter, with Owner on csc-backups (docs/backups.md).
[tasks.restore-drill]
description = "Restore the latest prod backups into a throwaway instance, check Directus starts on them, and delete it"
run = "./scripts/restore-drill"

# Needs Docker and DIRECTUS_LICENSE_KEY (docs/testing.md).
[tasks.ci-stack]
description = "Start Directus, its database, Mailpit, the fakes, Authentik and Listmonk in containers, for integration-ci"
run = "node scripts/ci-stack/index.ts up"

[tasks.ci-stack-down]
description = "Stop the CI stack"
run = "node scripts/ci-stack/index.ts down"

[tasks.integration-ci]
description = "Run the integration tests against the CI stack"
run = "pnpm exec vitest run --config vitest.integration.config.ts"
env.CI_STACK_TARGET = "{{config_root}}/.ci-stack/target.json"

[tasks.ci-seed]
description = "Fill the CI stack's Directus with sample data, for screenshots and demos"
run = "node scripts/ci-seed.ts"
env.CI_STACK_TARGET = "{{config_root}}/.ci-stack/target.json"
