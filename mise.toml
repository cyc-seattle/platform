[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10.34.9"
lefthook = "2"
pulumi = "3.273.0"
# Needs a system Python on macOS.
gcloud = "latest"
# For scripts/reset.
jq = "latest"
kubectl = "1.36"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Actions' auth step sets this, so keep it when set. Otherwise it's the main checkout's .gcloud/, even
# from a worktree, so every worktree shares one login.
GOOGLE_APPLICATION_CREDENTIALS = "{{ get_env(name='GOOGLE_APPLICATION_CREDENTIALS', default=exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir)\"') ~ '/.gcloud/application_default_credentials.json') }}"
GCP_PROJECT = "cyc-admin-scripts"
CLOUDSDK_CORE_PROJECT = "{{ env.GCP_PROJECT }}"
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='prod') }}"
# Each stack's state lives in its own environment's bucket, from stacks/bootstrap/state.ts.
PULUMI_BACKEND_URL = "gs://{{ env.GCP_PROJECT }}-pulumi-{{ env.PULUMI_STACK }}"

[tasks.install]
description = "Install dependencies, the Authentik SDK, git hooks, and the GKE auth plugin Pulumi's Kubernetes provider runs"
run = [
  "./scripts/gen-sdks",
  "pnpm install",
  "lefthook install",
  "gcloud components install gke-gcloud-auth-plugin --quiet",
]

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Typecheck, check formatting, and lint"
run = "./scripts/check"

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

[tasks.ci]
description = "Run all checks and tests"
depends = ["check", "test"]

# bootstrap is applied by a human with project Owner, never by CI (cyc-seattle/isthmia#118).
[tasks.preview-bootstrap]
description = "Show the diff `mise run deploy-bootstrap` would apply"
run = "pulumi preview --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

[tasks.deploy-bootstrap]
description = "Apply the bootstrap stack"
run = "pulumi up --yes --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

# scripts/each-stack picks the projects from PULUMI_STACK: dev is smoke, backend, then authentik, and prod is
# infra, backend, then authentik.
[tasks.preview]
description = "Show the diff `mise run deploy` would apply to $PULUMI_STACK"
run = "./scripts/each-stack preview"

[tasks.deploy]
description = "Apply $PULUMI_STACK's projects"
run = "./scripts/each-stack up --yes"

[tasks.build]
description = "Build the published package into dist/"
run = "pnpm run build"

[tasks.schema-types]
description = "Regenerate src/schema/index.ts, the Directus schema's types, from schemas/*.yaml"
run = "node scripts/schema-types.ts"

# Run by hand, with your own Google login (docs/syncs.md).
[tasks.calendar-sync]
description = "Sync a spreadsheet's events into Google Calendar"
run = "node src/syncs/calendar/main.ts"

[tasks.reset]
description = "Empty dev's CRM, reseed its fakes, and run both syncs, keeping Directus's database and activation"
run = "./scripts/reset"

# By hand only: no deploy runs it, and prod's run waits for the maintainer (cyc-seattle/platform#149).
[tasks.delete-plans]
description = "Delete every Financial Plan, plan, copy, row and result from $PULUMI_STACK, after asking"
run = "./scripts/delete-plans"

# By hand only: no deploy runs it (cyc-seattle/platform#150). docs/website.md says how.
[tasks.load-website]
description = "Load the website's proof of concept into $DIRECTUS_URL, after asking"
run = "node scripts/load-website.ts"

# Needs the dev deploy, so it isn't part of ci.
[tasks.integration]
description = "Run the integration tests against dev"
run = "pnpm exec vitest run --config vitest.integration.config.ts"
# Node gives each address only 250 ms before trying the next. Its IPv6 fallback fails at once on
# Actions' runners, so a slow connect to the cluster's endpoint failed the run.
env.NODE_OPTIONS = "--dns-result-order=ipv4first --no-network-family-autoselection"
