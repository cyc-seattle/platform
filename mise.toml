[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10.34.7"
lefthook = "2"
pulumi = "3.270.0"
# Needs a system Python on macOS.
gcloud = "latest"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Actions' auth step sets this, so keep it when set. Otherwise it's the main checkout's .gcloud/, even
# from a worktree, so every worktree shares one login.
GOOGLE_APPLICATION_CREDENTIALS = "{{ get_env(name='GOOGLE_APPLICATION_CREDENTIALS', default=exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir)\"') ~ '/.gcloud/application_default_credentials.json') }}"
GCP_PROJECT = "cyc-admin-scripts"
CLOUDSDK_CORE_PROJECT = "{{ env.GCP_PROJECT }}"
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='prod') }}"
# Each stack's state lives in its own environment's bucket, from stacks/bootstrap/state.ts.
PULUMI_BACKEND_URL = "gs://{{ env.GCP_PROJECT }}-pulumi-{{ env.PULUMI_STACK }}"

[tasks.install]
description = "Install dependencies, git hooks, and the GKE auth plugin Pulumi's Kubernetes provider runs"
run = ["pnpm install", "lefthook install", "gcloud components install gke-gcloud-auth-plugin --quiet"]

[tasks.format]
description = "Format and fix all files"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Typecheck, then check formatting and lint"
run = ["pnpm exec tsc -p tsconfig.json", "pnpm exec prettier --check .", "pnpm exec eslint ."]

[tasks.test]
description = "Run unit tests"
run = "pnpm exec vitest run"

[tasks.ci]
description = "Run all checks and tests"
depends = ["check", "test"]

[tasks.auth-adc]
description = "Point Application Default Credentials at your own gcloud login"
run = "./scripts/auth-adc"

# bootstrap is applied by a human with project Owner, never by CI (cyc-seattle/isthmia#118).
[tasks.preview-bootstrap]
description = "Show the diff `mise run deploy-bootstrap` would apply"
run = "pulumi preview --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

[tasks.deploy-bootstrap]
description = "Apply the bootstrap stack"
run = "pulumi up --yes --refresh --cwd stacks/bootstrap --stack \"$PULUMI_STACK\""

# scripts/each-stack picks the projects from PULUMI_STACK: dev is smoke then backend, prod is cloud then
# cluster.
[tasks.preview]
description = "Show the diff `mise run deploy` would apply to $PULUMI_STACK"
run = "./scripts/each-stack preview"

[tasks.deploy]
description = "Apply $PULUMI_STACK's projects"
run = "./scripts/each-stack up --yes"

[tasks.build]
description = "Build the package into dist/"
run = "pnpm run build"

[tasks.directus-local]
description = "Bring up local Directus and Postgres containers, and apply schemas/*.yaml to them"
run = "./scripts/directus-local up"

[tasks.directus-local-down]
description = "Tear down the local Directus and Postgres containers and their volume"
run = "./scripts/directus-local down"

# Needs the dev deploy, so it isn't part of ci.
[tasks.integration]
description = "Run the integration tests against dev"
run = "pnpm exec vitest run --config vitest.integration.config.ts"
