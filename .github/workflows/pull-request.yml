name: pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v2.5.2
  # A PR that changes only docs or CI deploys nothing. Elsewhere, projects is empty, so main deploys
  # them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
    steps:
      # A PR checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: changes
        if: github.event_name == 'pull_request'
        # bash adds pipefail. The assignment stops a failure from reading as "deploy nothing".
        shell: bash
        run: |
          projects="$(git diff --name-only --no-renames HEAD^1 HEAD | scripts/changed-projects)"
          echo "projects=$projects" | tee -a "$GITHUB_OUTPUT"
  dev:
    needs: [ci, changes]
    # A fork's PR gets no OIDC token, so it can't deploy.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.projects != '')
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v2.5.2
    # actions: read lets a branch's deploy wait for main's, so it can't cancel it (#69).
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      environment: dev
      task: deploy
      projects: ${{ needs.changes.outputs.projects }}
      integration: true
  # A cancelled dev deploy skips prod, so fail main's run where someone will see it.
  dev-cancelled:
    needs: dev
    if: always() && github.event_name == 'push' && needs.dev.result == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The dev deploy was cancelled, so prod was skipped. Rerun this workflow."
          exit 1
  # Runs merged code with prod credentials before anyone approves, which is safe only because
  # main requires a reviewed PR (cyc-seattle/isthmia#215).
  prod-preview:
    needs: dev
    if: github.event_name == 'push'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v2.5.2
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod-preview
      task: preview
  # Skipped when the preview shows no changes, so a no-op deploy never asks for approval.
  prod:
    needs: prod-preview
    if: github.event_name == 'push' && needs.prod-preview.outputs.changes == 'true'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v2.5.2
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
