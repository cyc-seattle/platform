name: pull-request

# Dev is one shared environment, so only the merge queue deploys to it, one PR at a time, and a PR's
# push runs only CI (#69, #80). The queue tests the commit that lands on main, so main's push goes
# straight to prod.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  # From a branch, `gh workflow run pull-request.yml --ref <branch>` deploys it to dev early. From
  # main, it retries prod.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref != 'refs/heads/main'
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v3.0.0
  # A queued PR that changes only docs or CI deploys nothing. A manual deploy leaves projects empty,
  # so it deploys them all.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
      # The base is the main commit the queue builds on, which may be more than one commit back.
      - id: changes
        # bash adds pipefail. The assignment stops a failure from reading as "deploy nothing".
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          projects="$(git diff --name-only --no-renames "$BASE" HEAD | scripts/changed-projects)"
          echo "projects=$projects" | tee -a "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
  dev:
    needs: [ci, changes]
    if: >-
      !cancelled() && needs.ci.result == 'success' && (
        (github.event_name == 'merge_group' && needs.changes.outputs.projects != '') ||
        (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
      )
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      task: deploy
      projects: ${{ needs.changes.outputs.projects }}
      integration: true
  # The check the queue requires, so it waits for dev. A skipped reusable workflow reports under
  # another name, so this job always runs. A PR passes it, and a queued PR passes only if dev passed
  # or had nothing to deploy.
  dev-passed:
    needs: [changes, dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          if [[ "$EVENT" != merge_group || "$DEV" == success ]]; then
            exit 0
          elif [[ "$DEV" == skipped && "$CHANGES" == success && -z "$PROJECTS" ]]; then
            echo "Only docs or CI changed, so dev wasn't deployed."
          else
            echo "::error::The dev deploy's result is $DEV, so this PR can't merge. Fix it and queue it again."
            exit 1
          fi
        env:
          EVENT: ${{ github.event_name }}
          DEV: ${{ needs.dev.result }}
          CHANGES: ${{ needs.changes.result }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
  # Runs merged code with prod credentials before anyone approves, which is safe only because
  # main requires a reviewed PR (cyc-seattle/isthmia#215).
  prod-preview:
    if: github.ref == 'refs/heads/main'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod-preview
      task: preview
  # Skipped when the preview shows no changes, so a no-op deploy never asks for approval.
  prod:
    needs: prod-preview
    if: needs.prod-preview.outputs.changes == 'true'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.0.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
