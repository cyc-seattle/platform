name: pull-request

# A PR's push runs only CI. Dev is one shared environment that takes only `main`, so each push to
# main deploys dev, starts the integration tests, and then previews and deploys prod (#280).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Retries main's deploys.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'pull_request'
    uses: cyc-seattle/.github/.github/workflows/ci.yml@v3.4.0
  dev:
    if: github.ref == 'refs/heads/main'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.4.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      task: deploy
  # A run started with GITHUB_TOKEN may start only a workflow_dispatch, so the tests run in a
  # workflow of their own, which keeps them out of this run.
  integration:
    needs: dev
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run integration.yml -R "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  # Runs merged code with prod credentials before anyone approves, which is safe only because
  # main requires a reviewed PR (cyc-seattle/isthmia#215).
  prod-preview:
    needs: dev
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.4.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod-preview
      task: preview
  # Skipped when the preview shows no changes, so a no-op deploy never asks for approval.
  prod:
    needs: prod-preview
    if: needs.prod-preview.outputs.changes == 'true'
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.4.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      task: deploy
