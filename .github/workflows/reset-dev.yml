name: reset-dev

# By hand: empties dev's CRM, reseeds its fakes, and runs both syncs, as deploy-dev. Dev takes only
# main, so it runs main's scripts/reset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v3.4.0
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      task: reset
