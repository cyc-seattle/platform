name: reset-dev

# By hand: empties dev's CRM, reseeds its fakes, and runs both syncs, as deploy-dev. Dispatch from a
# branch, `gh workflow run reset-dev.yml --ref <branch>`, runs that branch's workflow and scripts/reset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    uses: cyc-seattle/.github/.github/workflows/deploy.yml@v2.5.2
    # Only waits for reset-dev runs on main, not main's deploys, but grants it so the wait job doesn't warn.
    permissions:
      id-token: write
      contents: read
      actions: read
    with:
      environment: dev
      task: reset
