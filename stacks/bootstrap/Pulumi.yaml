name: bootstrap
description: Identity and access for the cyc-admin-scripts GCP project, its Pulumi state, and the org's GitHub settings.
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
    # Node 22 strips the types itself, so Pulumi's vendored ts-node stays out of the way.
    typescript: false
config:
  pulumi:tags:
    value:
      pulumi:template: gcp-typescript
