name: infra
description: Shared infrastructure that no app owns - the VPC, Cloud SQL, the DNS zones, Artifact Registry, the GKE Autopilot cluster, the shared Gateway, and each environment's namespace and platform outputs.
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
    # Node 22 strips the types itself, so Pulumi's vendored ts-node stays out of the way.
    typescript: false
